# The Mercure hub (docker-compose.mercure.yaml) on the site's own origin: the subscriber cookie reaches it
# and the backend's CSP (connect-src 'self') allows the EventSource.
location /.well-known/mercure {
    proxy_pass http://mercure;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
}
