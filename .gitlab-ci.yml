# CI for gitlab-runner-ddev-executor: every job runs inside its own DDEV
# project, so `ddev` is available directly and there is no `image:`.

stages:
    - test

variables:
    # Must match @playwright/test in package.json and .ddev/.env.playwright.
    PLAYWRIGHT_DOCKER_IMAGE: 'mcr.microsoft.com/playwright:v1.65.1-noble'

cgl:
    stage: test
    tags:
        - ddev
    script:
        - ddev start
        - ddev exec -d /var/www/html "composer run ci:php:lint"
        - ddev exec -d /var/www/html "composer run ci:php:stan"
        - ddev exec -d /var/www/html "composer run ci:php:cs"
        - ddev exec -d /var/www/html "composer run ci:php:unit"
        - ddev exec -d /var/www/html "composer run ci:composer:validate"

# End-to-end: `ddev start` provisions TYPO3 (db + test); the specs drive the backend module.
e2e:
    stage: test
    tags:
        - ddev
    script:
        - ddev start
        - ddev npm ci
        - ddev playwright test
    artifacts:
        when: always
        reports:
            junit: test-results/junit.xml
        paths:
            - test-results/
            - playwright-report/
        expire_in: 1 week

# Same checks on the development branch of the next major (TYPO3 v15 needs PHP 8.5).
e2e-typo3-v15:
    extends: e2e
    allow_failure: true
    variables:
        TYPO3_VERSION: '15.0.x-dev'
    script:
        - ddev config --php-version=8.5
        - ddev dotenv set .ddev/.env.web --typo3-version="${TYPO3_VERSION}"
        - ddev start
        - ddev exec -d /var/www/html "composer run ci:php:stan"
        - ddev exec -d /var/www/html "composer run ci:php:unit"
        - ddev npm ci
        - ddev playwright test
