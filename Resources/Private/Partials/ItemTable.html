<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<section class="mb-4" data-category="{category}">
    <h3>
        <f:translate key="category.{category}" extensionName="UnityTracker" />
        <span class="badge badge-default">{items -> f:count()}</span>
    </h3>
    <f:if condition="{items}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="column.title" extensionName="UnityTracker" /></th>
                            <th><f:translate key="column.project" extensionName="UnityTracker" /></th>
                            <th><f:translate key="{f:if(condition: '{category} == todo', then: 'column.reason', else: 'column.author')}" extensionName="UnityTracker" /></th>
                            <th><f:translate key="column.updated" extensionName="UnityTracker" /></th>
                            <th><f:translate key="column.connection" extensionName="UnityTracker" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{items}" as="item">
                            <tr>
                                <td>
                                    <f:if condition="{item.url}">
                                        <f:then><a href="{item.url}" target="_blank" rel="noopener noreferrer">{item.title}</a></f:then>
                                        <f:else>{item.title}</f:else>
                                    </f:if>
                                    <f:if condition="{item.draft}">
                                        <span class="badge badge-default"><f:translate key="item.draft" extensionName="UnityTracker" /></span>
                                    </f:if>
                                    <f:for each="{item.labels}" as="label">
                                        <span class="badge badge-info">{label}</span>
                                    </f:for>
                                </td>
                                <td class="text-nowrap">
                                    {item.project}
                                    <f:if condition="{item.reference}"><span class="text-body-secondary">{item.reference}</span></f:if>
                                </td>
                                <td class="text-nowrap">
                                    <f:if condition="{category} == todo">
                                        <f:then><span class="badge badge-notice">{item.reason}</span> {item.author}</f:then>
                                        <f:else>{item.author}</f:else>
                                    </f:if>
                                </td>
                                <td class="text-nowrap"><f:if condition="{item.updatedAt.timestamp}"><f:format.date format="d.m.Y H:i">{item.updatedAt}</f:format.date></f:if></td>
                                <td class="text-nowrap" title="{item.provider.name}">{item.connection}</td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <p class="text-body-secondary"><f:translate key="overview.nothing" extensionName="UnityTracker" /></p>
        </f:else>
    </f:if>
</section>
</html>
