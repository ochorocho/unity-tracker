<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="{f:if(condition: filter.uid, then: 'filters.edit', else: 'filters.new')}" extensionName="UnityTracker" /></h1>

    <form method="post" action="{saveUri}" class="mb-4" style="max-width: 40rem">
        <input type="hidden" name="uid" value="{filter.uid}" />
        <input type="hidden" name="definition" value="{definition}" />
        <div class="form-group mb-3">
            <span class="form-label d-block"><f:translate key="filters.column.filter" extensionName="UnityTracker" /></span>
            <f:render partial="FilterTokens" arguments="{tokens: tokens}" />
        </div>
        <div class="form-group mb-3">
            <label class="form-label" for="unitytracker-filter-title"><f:translate key="filters.column.title" extensionName="UnityTracker" /></label>
            <input class="form-control" type="text" id="unitytracker-filter-title" name="title" value="{filter.title}" maxlength="255" required />
        </div>
        <fieldset class="form-group mb-3">
            <legend class="form-label fs-6"><f:translate key="filters.form.groups" extensionName="UnityTracker" /></legend>
            <f:for each="{groups}" as="group">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="groups[]" value="{group.uid}" id="unitytracker-group-{group.uid}" {f:if(condition: group.checked, then: 'checked')} />
                    <label class="form-check-label" for="unitytracker-group-{group.uid}">{group.title}</label>
                </div>
            </f:for>
            <div class="form-text"><f:translate key="filters.form.groups.description" extensionName="UnityTracker" /></div>
        </fieldset>
        <button type="submit" class="btn btn-primary"><f:translate key="filters.form.submit" extensionName="UnityTracker" /></button>
    </form>
</f:section>
</html>
