<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">
    <style>
        [data-item-detail] img, [data-item-detail] [data-preview] img { max-width: 100%; height: auto; }
        [data-item-detail] .task-list, [data-item-detail] .contains-task-list { list-style: none; padding-left: 1.25em; }
        [data-item-detail] .task-list-item input[type="checkbox"] { margin: 0 .4em 0 -1.25em; vertical-align: middle; }
        [data-item-detail] [data-event-html] p { display: inline; margin: 0; }
    </style>
    <div data-item-detail data-editor-config="{editorConfig}" {f:if(condition: changed, then: 'data-item-changed')}>
        <f:if condition="{error}">
            <f:then>
                <f:be.infobox title="{f:translate(key: 'item.error.title', extensionName: 'UnityTracker')}" state="2">{error}</f:be.infobox>
            </f:then>
            <f:else>
                <div data-item-body aria-live="polite">
                    <f:render partial="ItemDetail/Body" arguments="{_all}" />
                </div>
            </f:else>
        </f:if>
    </div>
</f:section>
</html>
