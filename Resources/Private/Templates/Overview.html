<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="overview.title" extensionName="UnityTracker" /></h1>

    <f:if condition="{hasConnections}">
        <f:then>
            <p class="text-body-secondary">
                <f:translate key="overview.fetchedAt" extensionName="UnityTracker" arguments="{0: '{f:format.date(date: overview.fetchedAt, format: \'d.m.Y H:i\')}'}" />
            </p>

            <f:for each="{errors}" as="error">
                <f:be.infobox title="{error.title}" state="2">{error.message}</f:be.infobox>
            </f:for>

            <h2>
                <f:translate key="overview.attention" extensionName="UnityTracker" />
                <span class="badge badge-{f:if(condition: attentionCount, then: 'warning', else: 'success')}" data-attention-count="{attentionCount}">{attentionCount}</span>
            </h2>
            <f:if condition="!{attentionCount}">
                <p><f:translate key="overview.allDone" extensionName="UnityTracker" /></p>
            </f:if>
            <f:for each="{attention}" as="section">
                <f:render partial="ItemTable" arguments="{category: section.category, items: section.items}" />
            </f:for>

            <h2><f:translate key="overview.work" extensionName="UnityTracker" /></h2>
            <f:for each="{work}" as="section">
                <f:render partial="ItemTable" arguments="{category: section.category, items: section.items}" />
            </f:for>
        </f:then>
        <f:else>
            <f:be.infobox title="{f:translate(key: 'overview.empty.title', extensionName: 'UnityTracker')}" state="-1">
                <p><f:translate key="overview.empty.text" extensionName="UnityTracker" /></p>
                <a class="btn btn-primary" href="{connectionsUri}"><f:translate key="overview.empty.action" extensionName="UnityTracker" /></a>
            </f:be.infobox>
        </f:else>
    </f:if>
</f:section>
</html>
